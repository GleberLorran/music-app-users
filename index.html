<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Redirecionamento Atualizado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<style>
  /* Pinta o <html> de preto ANTES de qualquer coisa — mata a piscada branca */
  html {
    background: #000;
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
  }
  #fundo {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
    background: #000; /* fundo preto enquanto a imagem carrega */
  }
</style>
</head>
<body>

<img id="fundo" alt="Fundo" src="ok.jpg">

<script>
  const siteURL = "https://cdinfluences.netlify.app/";
  const imagemFundo = "ok.jpg";

  // Adiciona cache-busting com timestamp
  const timestamp = Date.now();
  const fundo = document.getElementById("fundo");
  fundo.src = imagemFundo + "?v=" + timestamp;

  // Espera 1 segundo antes de redirecionar
  setTimeout(() => {
    window.location.href = siteURL;
  }, 1000);
</script>

</body>
</html>
